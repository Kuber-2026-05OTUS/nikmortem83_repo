apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-metrics
  namespace: homework
  labels:
    app: nginx-with-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-with-metrics
  template:
    metadata:
      labels:
        app: nginx-with-metrics
        monitored: "true"
    spec:
      containers:
        - name: nginx
          image: nginx-custom:1.0.0
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args:
            - "-nginx.scrape-uri=http://127.0.0.1/stub_status"
            - "-web.listen-address=:9113"
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"