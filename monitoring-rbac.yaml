apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring
  namespace: homework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homework-monitoring
rules:
  # Для API Server
  - nonResourceURLs: ["/metrics", "/metrics/*"]
    verbs: ["get"]
  # Для metrics-server (pod metrics)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Для Prometheus
  - apiGroups: ["]"]
    resources: ["pods", "services", "endpoints", "nodes", "persistentvolumes", "persistentvolumeclaims", "replicasets", "deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homework-monitoring-binding
subjects:
  - kind: ServiceAccount
    name: monitoring
    namespace: homework
roleRef:
  kind: ClusterRole
  name: homework-monitoring
  apiGroup: rbac.authorization.k8s.io