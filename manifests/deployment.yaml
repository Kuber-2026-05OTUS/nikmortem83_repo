apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-app
  namespace: homework
  labels:
    app: homework-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: homework-app
  template:
    metadata:
      labels:
        app: homework-app
    spec:
      serviceAccountName: monitoring
      volumes:
        - name: homework-volume
          persistentVolumeClaim:
            claimName: homework-pvc
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: homework-conf-volume
          configMap:
            name: homework-config
      initContainers:
        - name: init-container
          image: busybox
          command: ['sh', '-c', 'mkdir -p /init && echo "<html><body><h1>Homework Assignment #5 - Morozov N.N.</h1><p>This file was created by init container busybox</p></body></html>" > /init/index.html && mkdir /conf']
          volumeMounts:
            - name: homework-volume
              mountPath: /init
        - name: metrics-fetcher
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl ca-certificates >/dev/null 2>&1

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA_CERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API_URL=https://kubernetes.default.svc
              OUTPUT=/init/metrics.html

              cat << EOF > $OUTPUT
              <!DOCTYPE html>
              <html lang="ru">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <head><title>Cluster Metrics</title></head>
              <body>
              <h1>📊 Cluster Metrics Report</h1>
              <p><strong>Generated by alpine</strong></p>
              <hr>
              
              <h2>1. 🔧 API Server Internal Metrics</h2>
              <pre>
              EOF

                        curl --fail \
                          --header "Authorization: Bearer $TOKEN" \
                          --cacert "$CA_CERT" \
                          "$API_URL/metrics" \
                          >> $OUTPUT 2>/tmp/api.err || \
                        echo "❌ Failed to fetch /metrics: $(cat /tmp/api.err)" >> $OUTPUT

                        cat << EOF >> $OUTPUT

              </pre>
              <hr>
              
              <h2>2. 🖥️ Node and Pod Resource Usage</h2>
              <h3>Nodes</h3>
              <pre>
              EOF

                        curl --fail \
                          --header "Authorization: Bearer $TOKEN" \
                          --cacert "$CA_CERT" \
                          "$API_URL/apis/metrics.k8s.io/v1beta1/nodes" \
                          >> $OUTPUT 2>/tmp/nodes.err || \
                        echo "❌ Failed to fetch node metrics: $(cat /tmp/nodes.err)" >> $OUTPUT

                        cat << EOF >> $OUTPUT

              </pre>
              <h3>Pods</h3>
              <pre>
              EOF

                        curl --fail \
                          --header "Authorization: Bearer $TOKEN" \
                          --cacert "$CA_CERT" \
                          "$API_URL/apis/metrics.k8s.io/v1beta1/pods" \
                          >> $OUTPUT 2>/tmp/pods.err || \
                        echo "❌ Failed to fetch pod metrics: $(cat /tmp/pods.err)" >> $OUTPUT

                        cat << EOF >> $OUTPUT

              </pre>
              <hr>
              <p><em>✅ Generated at $(date)</em></p>
              </body>
              </html>
              EOF
              echo "✅ Combined metrics saved to /init/metrics.html"
          volumeMounts:
            - name: homework-volume
              mountPath: /init
      containers:
        - name: homework-nginx
          image: nginx:latest
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: homework-volume
              mountPath: /homework
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d
            - name: homework-conf-volume
              mountPath: /homework/conf
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "rm -f /homework/index.html"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      nodeSelector:
        homework: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1