apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homework-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app.labels.app }}
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.labels.app }}
        {{- include "homework-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.monitoring.name }}
      volumes:
        - name: homework-volume
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvc.name }}
        - name: nginx-config-volume
          configMap:
            name: {{ .Values.configMaps.nginx.name }}
        - name: homework-conf-volume
          configMap:
            name: {{ .Values.configMaps.app.name }}
      initContainers:
        - name: {{ .Values.containers.initContainer.name }}
          image: "{{ .Values.images.initContainer.repository }}:{{ .Values.images.initContainer.tag }}"
          imagePullPolicy: {{ .Values.images.initContainer.pullPolicy }}
          command:
            - sh
            - -c
            - |
              mkdir -p /init && echo "<html><body><h1>Homework Assignment #6 - Morozov N.N.</h1><p>This file was created by init container</p></body></html>" > /init/index.html && mkdir -p /conf
          volumeMounts:
            - name: homework-volume
              mountPath: /init
        - name: {{ .Values.containers.metricsFetcher.name }}
          image: "{{ .Values.images.metricsFetcher.repository }}:{{ .Values.images.metricsFetcher.tag }}"
          imagePullPolicy: {{ .Values.images.metricsFetcher.pullPolicy }}
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl ca-certificates >/dev/null 2>&1

              echo "Waiting for metrics-server..."
              until curl -sf -k \
                -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                https://kubernetes.default.svc/apis/metrics.k8s.io/v1beta1/nodes; do
                echo "metrics-server not ready, retrying..."
                sleep 3
              done
              echo "metrics-server is ready!"

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA_CERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API_URL=https://kubernetes.default.svc
              OUTPUT=/init/metrics.html

              cat << EOF > $OUTPUT
              <!DOCTYPE html>
              <html lang="ru">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <head><title>Cluster Metrics</title></head>
              <body>
              <h1>📊 Cluster Metrics Report</h1>
              <p><strong>Generated by alpine</strong></p>
              <hr>
              
              <h2>1. 🔧 API Server Internal Metrics</h2>
              <pre>
              EOF

                        curl --fail \
                          --header "Authorization: Bearer $TOKEN" \
                          --cacert "$CA_CERT" \
                          "$API_URL/metrics" \
                          >> $OUTPUT 2>/tmp/api.err || \
                        echo "❌ Failed to fetch /metrics: $(cat /tmp/api.err)" >> $OUTPUT

                        cat << EOF >> $OUTPUT

              </pre>
              <hr>
              
              <h2>2. 🖥️ Node and Pod Resource Usage</h2>
              <h3>Nodes</h3>
              <pre>
              EOF

                        curl --fail \
                          --header "Authorization: Bearer $TOKEN" \
                          --cacert "$CA_CERT" \
                          "$API_URL/apis/metrics.k8s.io/v1beta1/nodes" \
                          >> $OUTPUT 2>/tmp/nodes.err || \
                        echo "❌ Failed to fetch node metrics: $(cat /tmp/nodes.err)" >> $OUTPUT

                        cat << EOF >> $OUTPUT

              </pre>
              <h3>Pods</h3>
              <pre>
              EOF

                        curl --fail \
                          --header "Authorization: Bearer $TOKEN" \
                          --cacert "$CA_CERT" \
                          "$API_URL/apis/metrics.k8s.io/v1beta1/pods" \
                          >> $OUTPUT 2>/tmp/pods.err || \
                        echo "❌ Failed to fetch pod metrics: $(cat /tmp/pods.err)" >> $OUTPUT

                        cat << EOF >> $OUTPUT

              </pre>
              <hr>
              <p><em>✅ Generated at $(date)</em></p>
              </body>
              </html>
              EOF
              echo "✅ Combined metrics saved to /init/metrics.html"
          volumeMounts:
            - name: homework-volume
              mountPath: /init
      containers:
        - name: {{ .Values.containers.nginx.name }}
          image: "{{ .Values.images.nginx.repository }}:{{ .Values.images.nginx.tag }}"
          imagePullPolicy: {{ .Values.images.nginx.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containers.nginx.port }}
          volumeMounts:
            - name: homework-volume
              mountPath: /homework
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d
            - name: homework-conf-volume
              mountPath: /homework/conf
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - rm -f /homework/index.html
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.containers.nginx.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- if and .Values.probes.enabled .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.containers.nginx.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
