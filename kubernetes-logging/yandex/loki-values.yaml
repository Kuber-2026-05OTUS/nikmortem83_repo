auth_enabled: false

deploymentMode: Monolithic

nodeSelector:
  node-role: infra
tolerations:
  - key: node-role
    operator: Equal
    value: infra
    effect: NoSchedule

commonConfig:
  replication_factor: 1

storage:
  type: s3
  s3:
    endpoint: "minio.example.com"
    bucketName: "loki-logs-yc"
    accessKeyId: "<ACCESS_KEY_ID>"
    secretAccessKey: "<SECRET_ACCESS_KEY>"
    insecure: false

schemaConfig:
  configs:
    - from: "2024-01-01"
      store: tsdb
      index:
        prefix: loki_index_
        period: 24h
      object_store: s3
      schema: v13

limits_config:
  allow_structured_metadata: true
  volume_enabled: true

rulerConfig:
  enable_api: true

singleBinary:
  replicas: 1
  initContainers:
    - name: init-storage-permissions
      image: busybox:1.36
      command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: storage
          mountPath: /var/loki

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

persistence:
  enabled: false