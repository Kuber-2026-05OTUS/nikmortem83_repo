apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httproute.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homework-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.namespace }}
  hostnames:
    - {{ .Values.httproute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics.html
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /homepage
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /index.html
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /index.html
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /conf
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
